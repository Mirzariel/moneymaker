# Alternative to start.sh/start.bat (e.g. on a VPS):  docker compose up -d --build
# Then open the login link printed in:  docker compose logs bot | grep login
services:
  bot:
    build: .
    restart: unless-stopped          # comes back after crashes and reboots
    environment:
      API_HOST: 0.0.0.0              # inside the container; exposed only on the host's localhost below
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env             # the setup page writes API keys here
      - ./config.yaml:/app/config.yaml
    ports:
      - "127.0.0.1:8000:8000"
